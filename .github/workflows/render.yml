name: Render display image
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: render
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Screenshot the plan
        run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 2
          node render.js
      - name: Snap to the six e-ink colors
        run: pip install pillow && python3 quantize.py plan.png
      - name: Publish plan.png to the display branch
        run: |
          mkdir out && cp plan.png out/ && cd out
          git init -q -b display
          git config user.name "plan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plan.png
          git commit -qm "Render $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" display
