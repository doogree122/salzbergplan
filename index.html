<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salzberg Weekly Plan</title>
<style>
/* Six E Ink Spectra 6 colors only */
:root{--k:#000;--w:#fff;--r:#d0201a;--y:#f2c500;--g:#1c8a3c;--b:#1b4fbf}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:#fff;display:flex;align-items:center;justify-content:center;font-family:Arial,Helvetica,sans-serif;color:var(--k)}
#stage{width:800px;height:480px;flex:none;transform-origin:center}
#screen{width:800px;height:480px;background:var(--w);border:4px solid var(--k);display:grid;grid-template-columns:1fr 292px;grid-template-rows:68px 1fr 26px;overflow:hidden}
.top{grid-column:1/3;background:var(--y);border-bottom:4px solid var(--k);display:flex;align-items:center;padding:0 16px;gap:14px}
.top .day{font:900 42px/1 "Arial Black",Arial,sans-serif;letter-spacing:-1px}
.top .date{font:700 20px Arial,sans-serif}
.top .ttl{margin-left:auto;text-align:right;font:900 15px/1.15 "Arial Black",Arial,sans-serif}
.left{display:flex;flex-direction:column;border-right:4px solid var(--k);min-height:0}
.kids{flex:1;display:flex;flex-direction:column;min-height:0}
.kid{display:flex;border-bottom:3px solid var(--k);min-height:0}
.kn{width:34px;background:var(--k);color:var(--w);display:flex;align-items:center;justify-content:center;font:900 15px "Arial Black",Arial,sans-serif;flex:none}
.kn span{writing-mode:vertical-rl;transform:rotate(180deg)}
.rows{flex:1;display:flex;flex-direction:column}
.row{flex:1;display:flex;align-items:center;gap:8px;padding:3px 10px 3px 8px;border-bottom:2px solid var(--k)}
.row:last-child{border-bottom:0}
.lab{width:46px;font:700 11px Arial,sans-serif;flex:none}
.txt{flex:1;font:700 15px/1.1 Arial,sans-serif}
.txt.none{font-weight:400}
.badge{width:30px;height:30px;border-radius:50%;border:3px solid var(--k);display:flex;align-items:center;justify-content:center;font:900 14px "Arial Black",Arial,sans-serif;flex:none}
.off{background:var(--k);color:var(--w)}
.flag{background:var(--y)}
.dinner{background:var(--g);color:var(--w);display:flex;align-items:center;gap:10px;padding:0 14px;height:46px;flex:none;border-top:4px solid var(--k)}
.dinner small{font:700 12px Arial,sans-serif}
.dinner b{font:900 21px "Arial Black",Arial,sans-serif}
.right{display:flex;flex-direction:column;min-height:0}
.tile{flex:1;padding:8px 12px;border-bottom:3px solid var(--k);display:flex;flex-direction:column;justify-content:center;gap:3px}
.tile:last-child{border-bottom:0}
.tile .d{font:900 18px "Arial Black",Arial,sans-serif}
.tile .m{font:900 14px Arial,sans-serif;background:var(--g);color:var(--w);padding:3px 7px;display:inline-block;align-self:flex-start}
.tile .a{font:700 13px/1.25 Arial,sans-serif}
footer{grid-column:1/3;background:var(--k);color:var(--w);display:flex;align-items:center;gap:14px;padding:0 12px;font:700 12px Arial,sans-serif;white-space:nowrap;overflow:hidden}
.sw{width:12px;height:12px;border:2px solid var(--w);border-radius:50%;display:inline-block;margin-right:4px;vertical-align:-2px}
.msg{grid-column:1/3;display:flex;align-items:center;justify-content:center;font:700 20px Arial,sans-serif;padding:20px;text-align:center}
</style>
</head>
<body>
<div id="stage"><div id="screen"></div></div>
<script>
/* ================= SETTINGS ================= */
// Google Sheet "Publish to web" CSV link. Leave "" to use schedule.csv in this repo.
// You can also pass it in the URL instead:  index.html?sheet=<published CSV link>
const SHEET_CSV = "";
const TIME_ZONE = "America/New_York"; // the display's server may be in another time zone
const ROLLOVER_HOUR = 19;             // from 7 pm on, show tomorrow's plan
/* ============================================ */

const COLORS={blue:"var(--b)",red:"var(--r)",green:"var(--g)",yellow:"var(--y)",black:"var(--k)",white:"var(--w)"};
const WD={sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6};
const FULL=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const screen=document.getElementById("screen");

function parseCSV(t){ // handles quoted cells with commas/newlines
  const out=[];let row=[],cell="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c=='"')q=true;else if(c==",") {row.push(cell);cell=""}
    else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;row.push(cell);out.push(row);row=[];cell=""}
    else cell+=c}
  if(cell!==""||row.length){row.push(cell);out.push(row)}
  return out.map(r=>r.map(s=>s.trim()));
}

function toData(rows){
  const head=rows.shift(), dayCols=[];
  head.forEach((h,i)=>{const n=WD[h.slice(0,3).toLowerCase()];if(i>=2&&n!==undefined)dayCols.push({i,n})});
  if(!dayCols.length) throw new Error("No day columns (Tue, Wed, …) found in the header row");
  const d={days:dayCols.map(c=>c.n),rows:[],dinner:dayCols.map(()=>""),drivers:[]};
  rows.forEach(r=>{
    const kid=r[0]||"",item=r[1]||"",vals=dayCols.map(c=>r[c.i]||"");
    if(!kid&&!item&&!vals.join(""))return;
    if(/^dinner$/i.test(kid)) d.dinner=vals;
    else if(/^driver$/i.test(kid)){const col=(r[2]||"").toLowerCase();if(item&&COLORS[col])d.drivers.push([item,col])}
    else if(kid) d.rows.push([kid,item,vals]);
  });
  d.drivers.sort((a,b)=>(a[1]==="white")-(b[1]==="white")); // colored drivers win over helpers
  return d;
}

function nowParts(){
  const p=Object.fromEntries(new Intl.DateTimeFormat("en-US",{timeZone:TIME_ZONE,weekday:"short",hour:"numeric",hourCycle:"h23",year:"numeric",month:"numeric",day:"numeric"}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  return {wd:WD[p.weekday.toLowerCase()],hour:+p.hour,date:new Date(+p.year,+p.month-1,+p.day)};
}

function render(D){
  const P=nowParts();
  let target=P.hour>=ROLLOVER_HOUR?(P.wd+1)%7:P.wd;
  // focus = first schedule day on/after target
  let best=0,bestGap=99;D.days.forEach((n,i)=>{const g=(n-target+7)%7;if(g<bestGap){bestGap=g;best=i}});
  const f=best, gapFromToday=(D.days[f]-P.wd+7)%7;
  const dd=new Date(P.date);dd.setDate(dd.getDate()+gapFromToday);
  const label=gapFromToday===0?"":gapFromToday===1?" (tomorrow)":" (next school day)";

  const who=v=>D.drivers.find(([n])=>new RegExp("\\b"+n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i").test(v));
  const badge=v=>{const m=who(v);if(!m)return"";const [n,c]=m;
    return `<span class="badge" style="background:${COLORS[c]};color:${c==="yellow"||c==="white"?"#000":"#fff"}">${esc(n[0].toUpperCase())}</span>`};
  const empty=v=>!v||v==="—"||v==="-";
  const kids=[...new Set(D.rows.map(r=>r[0]))];
  const kidsHTML=kids.map(k=>{const rs=D.rows.filter(r=>r[0]===k);
    return `<div class="kid" style="flex:${rs.length===1?1:rs.length*1.15}"><div class="kn"><span>${esc(k)}</span></div><div class="rows">`+
      rs.map(r=>{const v=r[2][f]||"",off=/NO SCHOOL/i.test(v),fl=/\?|NEEDS/i.test(v);
        return `<div class="row ${off?"off":""} ${fl?"flag":""}"><span class="lab">${esc(r[1])}</span><span class="txt ${empty(v)?"none":""}">${esc(empty(v)?"—":v)}</span>${off?"":badge(v)}</div>`}).join("")+`</div></div>`}).join("");

  // tiles: first word of each kid's "After" activity
  const after=kids.map(k=>D.rows.find(r=>r[0]===k&&/after/i.test(r[1])));
  const short=i=>after.map((r,j)=>{const v=r?r[2][i]:"";if(empty(v)||/NO SCHOOL/i.test(v))return"";
    return `<b>${esc(kids[j][0])}</b> ${esc(v.split(/[.,(]/)[0].trim().split(/\s+/)[0])}`}).filter(Boolean).join(" &nbsp; ")||"No after-school";
  const tiles=D.days.map((n,i)=>i===f?"":`<div class="tile"><div class="d">${FULL[n]}</div>${D.dinner[i]?`<span class="m">${esc(D.dinner[i])}</span>`:""}<div class="a">${short(i)}</div></div>`).join("");

  const legend=D.drivers.filter(d=>d[1]!=="white").map(([n,c])=>`<span><i class="sw" style="background:${COLORS[c]}"></i>${esc(n)}</span>`).join("");
  screen.innerHTML=`<div class="top"><div class="day">${FULL[D.days[f]]}</div><div class="date">${dd.toLocaleDateString("en-US",{month:"long",day:"numeric"})}${label}</div><div class="ttl">Salzberg<br>Weekly Plan</div></div>
   <div class="left"><div class="kids">${kidsHTML}</div><div class="dinner"><small>Dinner</small><b>${esc(D.dinner[f]||"—")}</b></div></div>
   <div class="right">${tiles}</div>
   <footer>Driver: ${legend}<span style="margin-left:auto">${kids.map(k=>esc(k[0])+" "+esc(k)).join(" &nbsp; ")}${D.stale?" &nbsp;· SHEET OFFLINE":""}</span></footer>`;
}

async function getCSV(url){
  const r=await fetch(url+(url.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const t=await r.text();if(/^\s*</.test(t))throw new Error("Got a web page, not CSV — use the 'Publish to web' CSV link");
  return t;
}
async function load(){
  const sheet=new URLSearchParams(location.search).get("sheet")||SHEET_CSV;
  let D;
  try{
    if(!sheet)throw 0;
    D=toData(parseCSV(await getCSV(sheet)));
  }catch(e){
    if(sheet)console.warn("Sheet failed, using schedule.csv:",e);
    try{D=toData(parseCSV(await getCSV("schedule.csv")));D.stale=!!sheet}
    catch(e2){screen.innerHTML=`<div class="msg">Couldn't load the schedule.<br>${esc(e2.message||e2)}</div>`;document.body.dataset.ready="error";return}
  }
  render(D);document.body.dataset.ready="1";
}
function fit(){const s=Math.min(innerWidth/800,innerHeight/480);document.getElementById("stage").style.transform="scale("+s+")"}
addEventListener("resize",fit);fit();load();
</script>
</body>
</html>
