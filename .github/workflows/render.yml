name: Render display image
on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 min, off the top of the hour when GitHub is busiest
  workflow_dispatch:
    inputs:
      preview:
        description: "Also publish crops-preview.png (every album photo with its faces and crop)"
        type: boolean
        default: false
      shabbat_preview:
        description: "Also publish shabbat-preview.png (the Friday-evening/Saturday screen, any day)"
        type: boolean
        default: false
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: render
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Pick the family photo
        env:
          PREVIEW: ${{ inputs.preview && '1' || '0' }}
          SHABBAT: ${{ inputs.shabbat_preview && '1' || '0' }}
        run: |
          pip install pillow opencv-python-headless numpy
          curl -fsSL -o face_detection_yunet_2023mar.onnx https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx || echo "face model download failed; using the plain crop"
          python3 photo.py
      - name: Screenshot the plan
        env:
          SHABBAT_PREVIEW: ${{ inputs.shabbat_preview && '1' || '0' }}
        run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 2
          node render.js
      - name: Snap to the six e-ink colors
        run: |
          python3 quantize.py plan.png
          [ ! -f shabbat-preview.png ] || python3 quantize.py shabbat-preview.png
      - name: Publish plan.png to the display branch
        run: |
          mkdir out && cp plan.png out/ && { [ ! -f crops-preview.png ] || cp crops-preview.png out/; } && { [ ! -f shabbat-preview.png ] || cp shabbat-preview.png out/; } && cd out
          git init -q -b display
          git config user.name "plan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Render $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" display
