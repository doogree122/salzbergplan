<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salzberg Weekly Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&family=Frank+Ruhl+Libre:wght@700;900&display=block" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Six E Ink Spectra 6 colors only */
:root{--k:#000;--w:#fff;--r:#d0201a;--y:#f2c500;--g:#1c8a3c;--b:#1b4fbf}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:#fff;display:flex;align-items:center;justify-content:center;font-family:Nunito,Arial,sans-serif;color:var(--k)}
#stage{width:800px;height:480px;flex:none;transform-origin:center}
#screen{width:800px;height:480px;background:var(--w);display:grid;grid-template-columns:1fr 320px;grid-template-rows:62px 1fr 24px;gap:6px;padding:6px;overflow:hidden}
.fred{font-family:Fredoka,Nunito,Arial,sans-serif}
svg{display:block;flex:none}

/* header */
.top{grid-column:1/3;background:var(--y);border:3px solid var(--k);border-radius:16px;display:flex;align-items:center;padding:0 12px 0 8px;gap:10px;position:relative;overflow:hidden}
.top .day{font:700 40px/1 Fredoka,Arial,sans-serif;letter-spacing:-.5px}
.top .date{font:800 19px Nunito,Arial,sans-serif;margin-top:8px}
.top .ttl{margin-left:auto;display:flex;align-items:center;gap:8px;font:700 17px/1.05 Fredoka,Arial,sans-serif;text-align:right}

/* kids */
.left{display:flex;flex-direction:column;gap:6px;min-height:0}
.kid{display:flex;border:3px solid var(--k);border-radius:14px;overflow:hidden;min-height:0}
.av{width:40px;flex:none;display:flex;align-items:center;justify-content:center;border-right:3px solid var(--k);color:var(--w);font:700 17px Fredoka,Arial,sans-serif}
.av span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap}
.rows{flex:1;display:flex;flex-direction:column;min-width:0}
.row{flex:1;display:flex;align-items:center;gap:8px;padding:2px 8px 2px 6px;border-bottom:2px dashed var(--k);min-height:0}
.row:last-child{border-bottom:0}
.tx{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.lab{font:900 9.5px/1 Nunito,Arial,sans-serif;letter-spacing:.6px;text-transform:uppercase}
.val{font:800 14.5px/1.08 Nunito,Arial,sans-serif;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.val.none{font-weight:700}
.badge{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--k);display:flex;align-items:center;justify-content:center;font:700 14px Fredoka,Arial,sans-serif;flex:none}
.row.off{background:var(--k);color:var(--w)}
.row.flag{background:var(--y)}
.dinner{background:var(--g);color:var(--w);border:3px solid var(--k);border-radius:14px;display:flex;align-items:center;gap:10px;padding:0 10px;height:50px;flex:none}
.dinner small{font:900 10px Nunito,Arial,sans-serif;letter-spacing:.8px;text-transform:uppercase;display:block}
.dinner b{font:700 21px/1 Fredoka,Arial,sans-serif}
.dinner .night{margin-left:auto;text-align:right;font:800 12px/1.15 Nunito,Arial,sans-serif;max-width:46%}

/* family photo (right side) — photo.png is made by photo.py at 314x364 */
.right{position:relative;border:3px solid var(--k);border-radius:14px;overflow:hidden;background:var(--b);min-height:0}
.right img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 38%;image-rendering:pixelated}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--w);font:700 20px/1.1 Fredoka,Arial,sans-serif;text-align:center}
.ph[hidden]{display:none}
.fyi{position:absolute;left:6px;right:6px;bottom:6px;background:var(--w);border:3px solid var(--k);border-radius:12px;padding:6px 8px 7px;display:flex;flex-direction:column;gap:3px}
.fyi .tag{align-self:flex-start;background:var(--r);color:var(--w);border-radius:6px;padding:1px 7px;font:700 13px/1.2 Fredoka,Arial,sans-serif;letter-spacing:.5px}
.fyi .n{display:flex;gap:6px;align-items:flex-start;font:800 12.5px/1.15 Nunito,Arial,sans-serif}
.fyi .n i{width:8px;height:8px;border-radius:50%;background:var(--b);border:1.5px solid var(--k);flex:none;margin-top:3px}
.dot{width:15px;height:15px;border-radius:50%;border:2px solid var(--k);color:#fff;font:700 9px/11px Fredoka,Arial,sans-serif;text-align:center;flex:none}

footer{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 4px;font:800 12px Nunito,Arial,sans-serif;white-space:nowrap;overflow:hidden}
footer .lg{display:flex;align-items:center;gap:4px}
footer .lg .badge{width:18px;height:18px;font-size:10px;border-width:2px}
/* Shabbat screen: Friday from 4 pm and all of Saturday */
#screen.shabbat{display:block;padding:0;position:relative;background:var(--b)}
.shabbat>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.shabbat .ph{color:var(--w)}
.sh{position:absolute;right:12px;bottom:12px;background:var(--w);border:3px solid var(--k);border-radius:16px;padding:8px 16px 10px;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.sh .hb{font:900 46px/1.05 "Frank Ruhl Libre",serif;direction:rtl}
.sh .t{display:flex;align-items:center;gap:8px;font:800 17px/1.1 Nunito,Arial,sans-serif}
.sh .t b{font:700 19px Fredoka,Arial,sans-serif}
.msg{grid-column:1/3;grid-row:1/4;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;font:800 20px Nunito,Arial,sans-serif;text-align:center;border:3px solid var(--k);border-radius:16px}
</style>
</head>

/* ---------- read the Google Sheet (values + cell colors + hidden rows/cols) ---------- */
function hex2rgb(h){h=(h||"").replace(/^#|^FF(?=[0-9A-F]{6}$)/i,"");if(h.length!==6)return null;return [0,2,4].map(i=>parseInt(h.substr(i,2),16))}
function hs(c){const [r,g,b]=c.map(x=>x/255),mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;
  if(d){h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h=(h*60+360)%360}return [h,mx?d/mx:0]}
// color distance that also respects hue, so pink never matches grey and light blue never matches light green
const dist=(a,b)=>{const [h1,s1]=hs(a),[h2,s2]=hs(b);
  if(Math.abs(s1-s2)>.06&&Math.min(s1,s2)<.06) return 1e9;
  if(s1>=.06&&s2>=.06){const dh=Math.min(Math.abs(h1-h2),360-Math.abs(h1-h2));if(dh>30)return 1e9}
  return Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2])};
function parseSheet(wb){
  const names=TAB?[TAB]:wb.SheetNames;
  for(const name of names){
    const ws=wb.Sheets[name]; if(!ws||!ws["!ref"]) continue;
    const R=XLSX.utils.decode_range(ws["!ref"]);
    const cell=(r,c)=>ws[XLSX.utils.encode_cell({r,c})];
    const txt=(r,c)=>{const x=cell(r,c);return x&&x.v!=null?String(x.w??x.v).replace(/\s*\n\s*/g," ").replace(/\s+/g," ").trim():""};
    const bg=(r,c)=>{const x=cell(r,c);return x&&x.s&&x.s.patternType!=="none"&&x.s.fgColor?hex2rgb(x.s.fgColor.rgb):null};
    const hidR=new Set((ws["!rows"]||[]).map((x,i)=>x&&x.hidden?i:-1)),hidC=new Set((ws["!cols"]||[]).map((x,i)=>x&&x.hidden?i:-1));
    let hr=-1;for(let r=0;r<=Math.min(R.e.r,15);r++) if(/^child/i.test(txt(r,0))){hr=r;break}
    if(hr<0) continue;
    const days=[];for(let c=1;c<=R.e.c;c++){const n=WD[txt(hr,c).slice(0,3).toLowerCase()];if(n!==undefined&&!hidC.has(c))days.push({c,n})}
    if(!days.length) continue;
    // legend
    const legend=[];
    for(let r=hr+1;r<=R.e.r;r++) if(/^legend/i.test(txt(r,0))){
      for(let rr=r+1;rr<=r+3;rr++) for(let c=0;c<=R.e.c;c++){const t=txt(rr,c),col=bg(rr,c);if(t&&col)legend.push({name:t,col})}
      break;
    }
    // FYI: a cell that says "FYI"; notes are to its right and in the rows below, up to the first blank row.
    // Notes on the FYI row always show. In the rows below, a note under a day column shows only on that day.
    const fyi=[],fyiRows=new Set();
    find: for(let r=0;r<=R.e.r;r++) for(let c=0;c<=R.e.c;c++){
      if(!/^fyi\b/i.test(txt(r,c))) continue;
      const rest=txt(r,c).replace(/^fyi\s*[:\-–]?\s*/i,"");
      if(rest) fyi.push({t:rest,day:null});
      fyiRows.add(r);
      for(let rr=r;rr<=R.e.r;rr++){
        if(rr>r&&hidR.has(rr)){fyiRows.add(rr);continue}
        if(rr>r&&/^legend/i.test(txt(rr,0))) break;
        let any=false;
        for(let cc=(rr===r?c+1:c);cc<=R.e.c;cc++){
          if(hidC.has(cc)) continue;
          const t=txt(rr,cc); if(!t) continue; any=true;
          const d=rr>r&&days.find(d=>d.c===cc); fyi.push({t,day:d?d.n:null});
        }
        if(rr>r){ if(!any) break; fyiRows.add(rr); }
      }
      break find;
    }
    const D={tab:name,days:days.map(d=>d.n),rows:[],dinner:days.map(()=>""),night:days.map(()=>""),legend,fyi};
    let kid="";
    for(let r=hr+1;r<=R.e.r;r++){
      const a=txt(r,0);
      if(/^legend/i.test(a)) break;
      if(fyiRows.has(r)) continue;
      if(a) kid=a;
      if(hidR.has(r)) continue;
      const vals=days.map(d=>({t:txt(r,d.c),bg:bg(r,d.c)}));
      if(/dinner/i.test(a)){D.dinner=vals.map(v=>v.t);continue}
      if(/night|activity/i.test(a)&&!txt(r,1)){D.night=vals.map(v=>v.t);D.nightLabel=a;continue}
      const item=txt(r,1); if(!item||!kid) continue;
      D.rows.push({kid,item,vals});
    }
    return D;
  }
  throw new Error("Couldn't find a tab with a “Child” header row");
}

/* who's driving: cell color matched to the sheet's Legend first, then names in the text */
function who(v,D){
  const nameRe=n=>new RegExp("\\b"+n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i");
  if(v.bg){
    if(v.bg.every(x=>x<40)) return {na:true};
    let best=null,bd=1e9;for(const L of D.legend){const d=dist(v.bg,L.col);if(d<bd){bd=d;best=L}}
    if(best&&bd<60){
      if(/need|figure/i.test(best.name)) return {flag:true};
      if(/fill/i.test(best.name)) best=null; else {const p=Object.keys(PEOPLE).find(n=>nameRe(n).test(best.name));return {name:p||best.name,color:PEOPLE[p]||"white"}}
    }
  }
  for(const n of Object.keys(PEOPLE)) if(nameRe(n).test(v.t)) return {name:n,color:PEOPLE[n]};
  for(const n of HELPERS) if(nameRe(n).test(v.t)) return {name:n,color:"white"};
  return null;
}
function badge(w,sz){
  if(!w||!w.name) return "";
  if(/^bus$/i.test(w.name)) return icon("bus",sz||28);
  const bgc=C[w.color]||W,fg=(w.color==="yellow"||w.color==="white")?K:W;
  return `<span class="badge" style="background:${bgc};color:${fg}${sz?`;width:${sz}px;height:${sz}px;font-size:${sz*.5}px`:""}">${esc(w.name[0].toUpperCase())}</span>`;
}

function nowParts(){
  const p=Object.fromEntries(new Intl.DateTimeFormat("en-US",{timeZone:TIME_ZONE,weekday:"short",hour:"numeric",hourCycle:"h23",year:"numeric",month:"numeric",day:"numeric"}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  return {wd:WD[p.weekday.toLowerCase()],hour:+p.hour,date:new Date(+p.year,+p.month-1,+p.day)};
}

function render(D){
  const P=nowParts(), target=P.hour>=ROLLOVER_HOUR?(P.wd+1)%7:P.wd;
  let f=0,g0=99;D.days.forEach((n,i)=>{const g=(n-target+7)%7;if(g<g0){g0=g;f=i}});
  const gap=(D.days[f]-P.wd+7)%7, dd=new Date(P.date);dd.setDate(dd.getDate()+gap);
  const dateOf=i=>{const x=new Date(dd);x.setDate(x.getDate()+D.days[i]-D.days[f]);return x}; // same week as the focus day
  const label=gap===0?"Today":gap===1?"Tomorrow":"Next school day";
  const empty=t=>!t||/^[—–-]+$/.test(t);
  const kids=[...new Set(D.rows.map(r=>r.kid))];
  const kc=k=>C[KID_COLORS[kids.indexOf(k)%KID_COLORS.length]];

  const kidHTML=kids.map(k=>{
    const rs=D.rows.filter(r=>r.kid===k);
    return `<div class="kid" style="flex:${rs.length+(rs.length===1?.5:0)}"><div class="av" style="background:${kc(k)}"><span>${esc(k)}</span></div><div class="rows">`+
      rs.map(r=>{
        const v=r.vals[f], w=who(v,D), off=/no school/i.test(v.t), na=w&&w.na, none=empty(v.t)||na;
        const fl=!off&&((w&&w.flag)||/\?|needs/i.test(v.t));
        const kind=/after|activ/i.test(r.item)?"after":/school/i.test(r.item)?"school":/home|back|pick/i.test(r.item)?"home":"after";
        const ic=off?"sun":none?"none":kind==="after"?pick(ACT,v.t,"star"):kind;
        return `<div class="row ${off?"off":""} ${fl?"flag":""}">${off?S(ICON.sun,28,W):icon(ic,28)}<div class="tx"><span class="lab">${esc(r.item)}</span><span class="val ${none?"none":""}">${none?"—":esc(v.t)}</span></div>${off||none?"":fl&&!(w&&w.name)?`<span class="badge" style="background:${W}">?</span>`:badge(w)}</div>`;
      }).join("")+`</div></div>`;
  }).join("");

  const din=D.dinner[f]||"", night=D.night[f]||"";
  const dinnerHTML=`<div class="dinner"><span style="background:${W};border-radius:50%;padding:3px;border:2px solid ${K}">${icon(pick(FOOD,din,"plate"),32)}</span><div><small>Family dinner</small><b>${esc(din||"—")}</b></div>${night?`<div class="night">${icon("heart",16).replace("<svg",'<svg style="display:inline-block;vertical-align:-3px"')} ${esc(D.nightLabel||"Night")}<br>${esc(night)}</div>`:""}</div>`;

  const notes=D.fyi.filter(n=>n.day==null||n.day===D.days[f]).slice(0,MAX_FYI);
  const fyiHTML=notes.length?`<div class="fyi"><span class="tag">FYI</span>${notes.map(n=>`<div class="n"><i></i><span>${esc(n.t)}</span></div>`).join("")}</div>`:"";
  const photoHTML=`<img id="photo" alt="" src="${PHOTO}?t=${Date.now()}" onerror="this.remove();document.getElementById('ph').hidden=false">
     <div class="ph" id="ph" hidden>${icon("house",64)}<div>Salzberg<br>Family</div>${icon("heart",34)}</div>${fyiHTML}`;

  const seen=new Set();
  const legend=D.legend.map(L=>{const p=Object.keys(PEOPLE).find(n=>new RegExp("\\b"+n+"\\b","i").test(L.name));return p}).filter(p=>p&&!seen.has(p)&&seen.add(p));
  const lgHTML=(legend.length?legend:Object.keys(PEOPLE)).map(p=>`<span class="lg">${badge({name:p,color:PEOPLE[p]},18)}${esc(p)}</span>`).join("");

  screen.innerHTML=`
   <div class="top">${icon("sun",44)}<div class="day">${FULL[D.days[f]]}</div><div class="date">${label} · ${dd.toLocaleDateString("en-US",{month:"long",day:"numeric"})}</div>
     <div class="ttl">Salzberg<br>Family Plan ${icon("house",38)}</div></div>
   <div class="left">${kidHTML}${dinnerHTML}</div>
   <div class="right">${photoHTML}</div>
   <footer>${icon("car",18)}Who's driving:${lgHTML}<span style="margin-left:auto;display:flex;align-items:center;gap:4px">${icon("star",14)}${esc(D.tab)}</span></footer>`;
}

function isShabbat(){
  if(new URLSearchParams(location.search).get("shabbat")==="1") return true;
  const P=nowParts();
  return SHABBAT_MODE&&((P.wd===5&&P.hour>=SHABBAT_START_HOUR)||P.wd===6);
}
// Candle lighting on Friday and the time Shabbat ends Saturday night (havdalah, or the candle lighting
// for a holiday that starts right after Shabbat), from hebcal.com for Atlanta.
async function shabbatTimes(){
  const P=nowParts(), fri=new Date(P.date); fri.setDate(fri.getDate()+(P.wd===6?-1:5-P.wd)); // this Friday (yesterday on Saturday)
  const ymd=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");
  const sat=new Date(fri); sat.setDate(sat.getDate()+1);
  const r=await fetch(`https://www.hebcal.com/shabbat?cfg=json&geonameid=${HEBCAL_GEONAMEID}&M=on&gy=${fri.getFullYear()}&gm=${fri.getMonth()+1}&gd=${fri.getDate()}`);
  const items=(await r.json()).items||[];
  const at=(day,cats)=>items.find(i=>i.date.startsWith(ymd(day))&&cats.includes(i.category));
  const time=i=>i?i.title.replace(/^[^:]*:\s*/,"").replace(/(am|pm)$/," $1"):"—";
  return {candles:time(at(fri,["candles"])), ends:time(at(sat,["havdalah","candles"]))};
}
async function renderShabbat(){
  screen.className="shabbat";
  let t={candles:"—",ends:"—"};
  try{t=await shabbatTimes()}catch(e){console.error("hebcal:",e)}
  screen.innerHTML=`<img id="photo" alt="" src="shabbat.png?t=${Date.now()}" onerror="this.remove();document.getElementById('ph').hidden=false">
    <div class="ph" id="ph" hidden>${icon("candles",90)}</div>
    <div class="sh"><div class="hb">שבת שלום</div>
      <div class="t">${icon("candles",24)}Candle lighting <b>${esc(t.candles)}</b></div>
      <div class="t">${icon("star",22)}Shabbat ends <b>${esc(t.ends)}</b></div></div>`;
}

function showError(msg){
  screen.innerHTML=`<div class="msg">${icon("clue",56)}<div>Couldn't read the family sheet</div><div style="font-size:14px;font-weight:700">${esc(msg)}</div></div>`;
}
async function load(){
  if(isShabbat()) await renderShabbat(); else try{
    if(!window.XLSX) throw new Error("Spreadsheet reader didn't load");
    const src=new URLSearchParams(location.search).get("xlsx")||`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=xlsx&t=${Date.now()}`;
    const r=await fetch(src,{cache:"no-store"}); if(!r.ok) throw new Error("Google returned "+r.status+" — is the sheet shared “Anyone with the link”?");
    const wb=XLSX.read(await r.arrayBuffer(),{cellStyles:true});
    render(parseSheet(wb));
  }catch(e){console.error(e);showError(e.message||String(e))}
  try{await document.fonts.ready}catch(e){}
  const img=document.getElementById("photo");
  if(img&&!img.complete) await new Promise(r=>{img.onload=r;img.addEventListener("error",r);setTimeout(r,8000)});
  document.body.dataset.ready="1";
}
function fit(){const s=Math.min(innerWidth/800,innerHeight/480);document.getElementById("stage").style.transform="scale("+s+")"}
addEventListener("resize",fit);fit();load();
</script>
